name: Release

# To cut a release:
#   1. Bump <version> in pom.xml (e.g. to 1.0.1) and commit it.
#   2. git tag v1.0.1
#   3. git push origin main --tags   (or push the commit, then the tag)
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pom.xml version matches tag
        shell: bash
        run: |
          pom_version=$(mvn -q -DforceStdout org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate -Dexpression=project.version)
          if [ "$pom_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pom.xml version ($pom_version) no coincide con el tag (${{ steps.version.outputs.version }}). Bumpeá <version> en pom.xml, commiteá, y luego taggeá esa versión."
            exit 1
          fi

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Resolve built jar name
        id: jar
        shell: bash
        run: |
          jar_path=$(ls target/*.jar | head -n1)
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Package app image with jpackage
        shell: cmd
        run: >
          jpackage --name "GMG-FunMenu"
          --input target
          --main-jar ${{ steps.jar.outputs.name }}
          --main-class core.Main
          --runtime-image runtime
          --dest installers
          --type app-image
          --app-version ${{ steps.version.outputs.version }}
          --icon src\main\resources\icon.ico

      # --- Signed path: only runs once SIGNPATH_API_TOKEN is configured as a repo secret. ---
      # Until then these steps are skipped entirely and the release ships unsigned (see below).
      # `secrets` can't be referenced directly in `if:` (GitHub rejects the workflow file for
      # it), so the check happens once here via `env`, and later steps gate on this step's output.
      - name: Check for SignPath credentials
        id: signpath
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "enabled=$([ -n "$SIGNPATH_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned exe for signing
        if: steps.signpath.outputs.enabled == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: installers\GMG-FunMenu\GMG-FunMenu.exe
          retention-days: 5

      - name: Sign exe with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}"
          github-artifact-id: "${{ steps.upload-unsigned.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Swap in the signed exe
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item -Force signed\GMG-FunMenu.exe installers\GMG-FunMenu\GMG-FunMenu.exe
      # --- End signed path ---

      - name: Bundle external tools (ffmpeg, yt-dlp, JNativeHook)
        shell: pwsh
        run: Copy-Item -Recurse -Force libs installers\GMG-FunMenu\libs

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path installers\GMG-FunMenu\* -DestinationPath "GMG-FunMenu-${{ steps.version.outputs.version }}-win64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GMG-FunMenu ${{ github.ref_name }}
          files: GMG-FunMenu-*-win64.zip
          generate_release_notes: true
